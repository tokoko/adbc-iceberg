[package]
name = "adbc-driver-iceberg"
version = "0.2.0"
edition = "2024"

[lib]
crate-type = ["lib", "cdylib"]

[dependencies]
adbc_core = "0.24.0"
adbc_ffi = "0.24.0"
driverbase = { git = "https://github.com/adbc-drivers/driverbase-rs.git" }
arrow-array = "59.3"
arrow-schema = "59.3"
# Pinned to unreleased main for serializable FileScanTask (apache/iceberg-rust#3091).
iceberg = { git = "https://github.com/apache/iceberg-rust.git", rev = "b2e90754b1f9eaea741d353d51ae644aa9cef479" }
iceberg-catalog-rest = { git = "https://github.com/apache/iceberg-rust.git", rev = "b2e90754b1f9eaea741d353d51ae644aa9cef479" }
iceberg-storage-opendal = { git = "https://github.com/apache/iceberg-rust.git", rev = "b2e90754b1f9eaea741d353d51ae644aa9cef479" }
tokio = { version = "1", features = ["rt-multi-thread"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
prost = "0.14"
# protox compiles the Substrait protos in-process, so the build needs no protoc.
substrait-prost = { version = "0.102", features = ["protox"] }

# Used only by the benchmarks in examples/.
[dev-dependencies]
opendal = { version = "0.58", features = ["services-s3"] }
object_store = { version = "0.12", features = ["aws"] }
parquet = { version = "55", features = ["async", "object_store"] }
bytes = "1"
